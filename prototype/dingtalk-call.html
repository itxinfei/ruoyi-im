<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>心飞IM · 通话</title>
<link rel="stylesheet" href="shared.css">
<style>
/* 通话页面专属 CSS */

/* 左侧通话记录 */
.call-list{width:var(--dt-l2-width);background:var(--dt-bg-panel);border-right:0.5px solid var(--dt-border);display:flex;flex-direction:column;flex-shrink:0}
.cl-header{height:56px;padding:0 16px;display:flex;align-items:center;font-size:16px;font-weight:500;border-bottom:0.5px solid var(--dt-border-light)}
.cl-list{flex:1;overflow-y:auto}
.cl-item{display:flex;align-items:center;gap:12px;padding:12px 16px;cursor:pointer;border-bottom:0.5px solid var(--dt-bg-body)}
.cl-item:hover{background:var(--dt-bg-hover)}
.cl-item.active{background:var(--dt-brand-light)}
.cl-avatar{width:var(--dt-avatar-session);height:var(--dt-avatar-session);border-radius:var(--dt-radius-lg);display:flex;align-items:center;justify-content:center;color:var(--dt-bg-card);font-size:16px;font-weight:600;flex-shrink:0}
.cl-info{flex:1;min-width:0}
.cl-name{font-size:14px;font-weight:500;margin-bottom:4px}
.cl-meta{font-size:12px;color:var(--dt-text-secondary);display:flex;align-items:center;gap:4px}
.cl-meta .incoming{color:var(--dt-success)}
.cl-meta .outgoing{color:var(--dt-brand)}
.cl-meta .missed{color:var(--dt-danger)}
.cl-time{font-size:11px;color:var(--dt-text-secondary)}

/* 主区 */
.call-main{flex:1;display:flex;align-items:center;justify-content:center;background:var(--dt-nav-dark);position:relative}
.video-container{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:32px}
.video-avatar-wrapper{position:relative}
.video-avatar{width:160px;height:160px;border-radius:50%;background:var(--dt-brand);display:flex;align-items:center;justify-content:center;color:var(--dt-bg-card);font-size:48px;font-weight:600}
.video-avatar.ringing{outline:3px solid rgba(39,126,251,0.5);outline-offset:6px}
.video-name{font-size:24px;font-weight:500;color:var(--dt-bg-card);margin-top:24px}
.video-status{font-size:16px;color:rgba(255,255,255,0.6)}
.video-duration{font-size:14px;color:rgba(255,255,255,0.6);margin-top:8px}

/* 小窗：对方画面 */
.video-pip{position:absolute;top:24px;right:24px;width:200px;height:120px;border-radius:var(--dt-radius-xl);background:var(--dt-nav-dark);border:2px solid rgba(255,255,255,0.2);overflow:hidden;display:flex;align-items:center;justify-content:center}
.video-pip-avatar{width:48px;height:48px;border-radius:50%;background:var(--dt-brand);display:flex;align-items:center;justify-content:center;color:var(--dt-bg-card);font-size:18px;font-weight:600}

/* 控制栏 */
.call-controls{position:absolute;bottom:40px;display:flex;align-items:center;gap:16px}
.ctrl-btn{width:52px;height:52px;border-radius:50%;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.2s}
.ctrl-btn{background:rgba(255,255,255,0.15);color:var(--dt-bg-card)}
.ctrl-btn:hover{background:rgba(255,255,255,0.25)}
.ctrl-btn.hangup{background:var(--dt-danger);width:60px;height:60px}

/* 语音通话背景 */
.voice-bg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.voice-wave{display:flex;align-items:center;gap:6px}
.voice-wave span{width:4px;height:24px;background:rgba(39,126,251,0.6);border-radius:2px}
.voice-wave span:nth-child(2){height:36px}
.voice-wave span:nth-child(3){height:48px}
.voice-wave span:nth-child(4){height:32px}
.voice-wave span:nth-child(5){height:40px}
.call-toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.8);color:var(--dt-bg-card);padding:8px 24px;border-radius:var(--dt-radius-md);font-size:13px;z-index:200;opacity:0;transition:opacity 0.2s;pointer-events:none}
.call-toast.show{opacity:1}

/* Toggle state */
.ctrl-btn.toggled{background:rgba(255,255,255,0.35)}
.ctrl-btn.toggled::after{content:'';position:absolute;bottom:4px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:var(--dt-bg-card)}
</style>
</head>
<body>

<!-- 通话记录 -->
<div class="call-list">
  <div class="cl-header">通话记录</div>
  <div class="cl-list">
    <div class="cl-item active">
      <div class="cl-avatar" style="background:var(--dt-av-blue);">张</div>
      <div class="cl-info">
        <div class="cl-name">张三</div>
        <div class="cl-meta"><span class="incoming">↙ 呼入</span><span>今天 13:20</span></div>
      </div>
      <div class="cl-time">12:35</div>
    </div>
    <div class="cl-item">
      <div class="cl-avatar" style="background:var(--dt-av-teal);">李</div>
      <div class="cl-info">
        <div class="cl-name">李四</div>
        <div class="cl-meta"><span class="outgoing">↗ 呼出</span><span>今天 11:05</span></div>
      </div>
      <div class="cl-time">08:22</div>
    </div>
    <div class="cl-item">
      <div class="cl-avatar" style="background:var(--dt-av-orange);">王</div>
      <div class="cl-info">
        <div class="cl-name">王五</div>
        <div class="cl-meta"><span class="missed">✕ 未接</span><span>昨天 18:30</span></div>
      </div>
      <div class="cl-time">--</div>
    </div>
    <div class="cl-item">
      <div class="cl-avatar" style="background:var(--dt-purple);">产</div>
      <div class="cl-info">
        <div class="cl-name">产品需求评审群</div>
        <div class="cl-meta"><span style="color:var(--dt-brand);">群视频会议</span><span>昨天 14:00</span></div>
      </div>
      <div class="cl-time">1:25:30</div>
    </div>
    <div class="cl-item">
      <div class="cl-avatar" style="background:var(--dt-av-pink);">赵</div>
      <div class="cl-info">
        <div class="cl-name">赵六</div>
        <div class="cl-meta"><span class="incoming">↙ 呼入</span><span>10-26 16:15</span></div>
      </div>
      <div class="cl-time">05:12</div>
    </div>
    <div class="cl-item">
      <div class="cl-avatar" style="background:var(--dt-av-cyan);">孙</div>
      <div class="cl-info">
        <div class="cl-name">孙七</div>
        <div class="cl-meta"><span class="outgoing">↗ 呼出</span><span>10-25 09:30</span></div>
      </div>
      <div class="cl-time">02:45</div>
    </div>
    <div class="cl-item">
      <div class="cl-avatar" style="background:var(--dt-text-tertiary);">技</div>
      <div class="cl-info">
        <div class="cl-name">技术架构组</div>
        <div class="cl-meta"><span style="color:var(--dt-warning);">群语音通话</span><span>10-24 17:00</span></div>
      </div>
      <div class="cl-time">45:10</div>
    </div>
  </div>
</div>

<!-- 主视频/语音区 -->
<div class="call-main">
  <!-- 语音波纹动画 -->
  <div class="voice-bg"><div class="voice-wave"><span></span><span></span><span></span><span></span><span></span></div></div>

  <div class="video-container">
    <div class="video-avatar-wrapper">
      <div class="video-avatar ringing">张</div>
    </div>
    <div class="video-name">张三</div>
    <div class="video-status">通话中</div>
    <div class="video-duration">12:35</div>
  </div>

  <!-- 小窗 -->
  <div class="video-pip">
    <div class="video-pip-avatar">我</div>
  </div>

  <!-- 控制栏 -->
  <div class="call-controls">
    <button class="ctrl-btn" id="ctrlMute" title="静音" aria-label="静音" onclick="toggleCtrl(this,'静音已开启','静音已关闭')">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/></svg>
    </button>
    <button class="ctrl-btn" id="ctrlSpeaker" title="扬声器" aria-label="扬声器" onclick="toggleCtrl(this,'扬声器已开启','扬声器已关闭')">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
    </button>
    <button class="ctrl-btn hangup" title="挂断" aria-label="挂断" onclick="hangupCall()">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="transform:rotate(135deg)"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.28 19.28 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72"/></svg>
    </button>
    <button class="ctrl-btn" id="ctrlCamera" title="摄像头" aria-label="摄像头" onclick="toggleCtrl(this,'摄像头已开启','摄像头已关闭')">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
    </button>
    <button class="ctrl-btn" title="更多" aria-label="更多" onclick="showCallToast('更多功能（演示）')">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></svg>
    </button>
  </div>
</div>

<script>
function showCallToast(msg){
  var t=document.getElementById('callToast');
  if(!t){document.body.insertAdjacentHTML('beforeend','<div id="callToast" class="call-toast"></div>');t=document.getElementById('callToast');}
  t.textContent=msg;t.classList.add('show');
  setTimeout(function(){t.classList.remove('show')},1200);
}
function toggleCtrl(btn,onMsg,offMsg){
  btn.classList.toggle('toggled');
  if(btn.classList.contains('toggled')){
    showCallToast(onMsg);
    btn.style.background='rgba(255,255,255,0.3)';
  }else{
    showCallToast(offMsg);
    btn.style.background='rgba(255,255,255,0.15)';
  }
}
function hangupCall(){
  showCallToast('通话已挂断');
  setTimeout(function(){
    if(history.length>1){history.back();}else{showCallToast('返回聊天页面（演示）');}
  },600);
}
// Call list item click
document.querySelectorAll('.cl-item').forEach(function(item){
  item.addEventListener('click',function(){
    document.querySelectorAll('.cl-item').forEach(function(i){i.classList.remove('active')});
    this.classList.add('active');
    var name=this.querySelector('.cl-name');
    if(name)document.querySelector('.video-name').textContent=name.textContent;
  });
});
</script>
<script src="shared.js"></script>
</body>
</html>
