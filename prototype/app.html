<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>心飞IM · 桌面外壳</title>
<link rel="stylesheet" href="shared.css">
<style>
  /* 外壳布局：顶部标题栏 +（固定 L1 + 右侧内容 iframe） */
  body{flex-direction:column}
  .electron-titlebar{display:flex}
  .xf-shell-main{flex:1;display:flex;min-height:0}
  .xf-stage{flex:1;min-width:0;height:100%;border:0;display:block;background:var(--dt-bg-body)}
</style>
</head>
<body class="electron" data-shell>
<svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" style="display:none" ><symbol id="i-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></symbol></svg>

<!-- 顶部标题栏 -->
<div class="electron-titlebar">
  <div class="title">
    <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--dt-brand)" stroke-width="1.5"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
    <span>心飞IM</span>
  </div>
  <div class="controls">
    <button class="ctrl-btn" onclick="window.electronAPI?.minimize()">─</button>
    <button class="ctrl-btn" onclick="window.electronAPI?.maximize()">□</button>
    <button class="ctrl-btn close" aria-label="关闭窗口" onclick="window.electronAPI?.close()"><svg aria-hidden="true" class="ic"><use href="#i-x"/></svg></button>
  </div>
</div>

<div class="xf-shell-main">
  <!-- L1 左侧导航栏 · 固定不动 -->
  <nav class="l1-nav">
    <div class="l1-avatar" id="l1Avatar" title="我" aria-label="我">我</div>
    <div class="l1-item active" data-go="dingtalk-mockup.html" title="消息" aria-label="消息">
      <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      <span>消息</span>
      <div class="l1-badge">24</div>
    </div>
    <div class="l1-item" data-go="dingtalk-contacts.html" title="通讯录" aria-label="通讯录">
      <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M17 21v-2a4 4 0 0 0-4-4H5"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      <span>通讯录</span>
    </div>
    <div class="l1-item" data-go="dingtalk-calendar.html" title="日历" aria-label="日历">
      <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      <span>日历</span>
    </div>
    <div class="l1-item" data-go="dingtalk-docs.html" title="文档" aria-label="文档">
      <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
      <span>文档</span>
    </div>
    <div class="l1-item" data-go="dingtalk-workbench.html" title="工作台" aria-label="工作台">
      <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
      <span>工作台</span>
    </div>
    <div class="l1-item" data-go="dingtalk-approval.html" title="审批" aria-label="审批">
      <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
      <span>审批</span>
    </div>
    <div class="l1-item" data-go="dingtalk-mail.html" title="邮箱" aria-label="邮箱">
      <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
      <span>邮箱</span>
    </div>

    <div class="l1-bottom">
      <div class="l1-item" onclick="xfShowPalette()" title="搜索" aria-label="搜索">
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <span>搜索</span>
      </div>
      <div class="l1-item" onclick="xfSettings()" title="设置" aria-label="设置">
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 1.82-.33z"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42"/></svg>
        <span>设置</span>
      </div>
    </div>
  </nav>

  <!-- 右侧内容区：切换菜单只更新这里，左侧导航保持不动 -->
  <iframe id="stage" class="xf-stage" src="dingtalk-mockup.html" title="内容区"></iframe>
</div>

<script src="shared.js"></script>
<script>
(function () {
  var stage = document.getElementById('stage');
  function go(page) {
    if (!page) return;
    stage.src = page;
    if (location.hash !== '#' + page) {
      try { history.replaceState(null, '', '#' + page); } catch (e) {}
    }
    var items = document.querySelectorAll('.l1-item[data-go]');
    for (var i = 0; i < items.length; i++) {
      items[i].classList.toggle('active', items[i].getAttribute('data-go') === page);
    }
  }
  var items = document.querySelectorAll('.l1-item[data-go]');
  for (var i = 0; i < items.length; i++) {
    items[i].addEventListener('click', function () { go(this.getAttribute('data-go')); });
  }
  var hash = (location.hash || '').replace('#', '');
  go(hash || 'dingtalk-mockup.html');
})();
</script>
</body>
</html>
