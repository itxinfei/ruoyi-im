/* 主内容区（骨架见 shared.css .l3-main） */

/* 工具栏 */
.toolbar { display:flex; align-items:center; gap:4px; padding:6px 8px; border-bottom:1px solid var(--dt-border); background:var(--dt-bg-body); }
.toolbar-btn { display:flex; align-items:center; gap:4px; padding:6px 12px; border:none; background:transparent; border-radius:var(--dt-radius-sm); cursor:pointer; color:var(--dt-text-primary); font-size:12px; white-space:nowrap; flex-shrink:0; }

.toolbar-btn .icon { font-size:14px; }

/* 地址栏行 */

.nav-btn { width:28px; height:28px; border:none; background:transparent; border-radius:var(--dt-radius-sm); cursor:pointer; display:flex; align-items:center; justify-content:center; color:var(--dt-text-secondary); }
.nav-btn:hover { background:var(--dt-brand-light); }

.address-bar { flex:1; display:flex; align-items:center; gap:4px; padding:5px 12px; background:var(--dt-bg-card); border:1px solid var(--dt-border); border-radius:var(--dt-radius-sm); font-size:13px; }
.address-bar .crumb { color:var(--dt-brand); cursor:pointer; padding:2px 6px; border-radius:3px; }
.address-bar .crumb:hover { background:var(--dt-brand-light); }
.address-bar .sep { color:var(--dt-text-tertiary); }
.address-bar .current { font-weight:500; color:var(--dt-text-primary); }

.search-box { display:flex; align-items:center; gap:4px; padding:5px 12px; background:var(--dt-bg-card); border:1px solid var(--dt-border); border-radius:var(--dt-radius-sm); font-size:12px; color:var(--dt-text-secondary); width:180px; overflow:hidden; }
.search-box svg { width:14px; height:14px; flex-shrink:0; }

/* 文件列表 */
.file-header { display:grid; grid-template-columns:1fr 110px 90px 70px; gap:8px; padding:6px 12px; font-size:12px; color:var(--dt-text-secondary); background:var(--dt-bg-body); border-bottom:1px solid var(--dt-border); font-weight:500; }
.file-header .sortable { cursor:pointer; display:flex; align-items:center; gap:4px; }

.file-list { flex:1; overflow-y:auto; background:var(--dt-bg-card); }
.file-row { display:grid; grid-template-columns:1fr 110px 90px 70px; gap:8px; padding:5px 12px; font-size:13px; color:var(--dt-text-primary); cursor:pointer; align-items:center; }
.file-row:hover { background:var(--dt-brand-light); }
.file-row.selected { background:var(--dt-brand-light); }

.file-name-cell { display:flex; align-items:center; gap:8px; }
.file-icon { width:24px; height:24px; border-radius:3px; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; color:var(--dt-bg-card); flex-shrink:0; }
.file-icon.folder { background:var(--dt-file-folder); color:var(--dt-bg-card); font-size:12px; }
.file-icon.doc { background:var(--dt-file-doc); }
.file-icon.sheet { background:var(--dt-file-sheet); }
.file-icon.slide { background:var(--dt-file-slide); }
.file-name { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.file-date { color:var(--dt-text-secondary); font-size:12px; }
.file-type { color:var(--dt-text-secondary); font-size:12px; }
.file-size { color:var(--dt-text-secondary); font-size:12px; text-align:right; }

/* 状态栏 */
.status-bar { display:flex; align-items:center; justify-content:space-between; padding:5px 12px; border-top:1px solid var(--dt-border); background:var(--dt-bg-body); font-size:12px; color:var(--dt-text-secondary); }

/* 右键菜单 */

.ctx-item .ctx-icon { width:16px; text-align:center; }

/* Toast（见 shared.css .xf-toast） */

/* ===== 云文档视觉增强（覆盖上方基础样式） ===== */

/* 左侧导航精修 */
.nav-section-title { padding:12px 16px 6px; font-size:12px; letter-spacing:.02em; }

.toolbar-right { margin-left:auto; display:flex; align-items:center; gap:8px; }

.file-card { position:relative; display:flex; flex-direction:column; gap:10px; padding:16px; min-height:154px; border:1px solid #EDEFF2; border-radius:10px; background:var(--dt-bg-card); cursor:pointer; transition:border-color .15s,box-shadow .15s,transform .15s; }

<script>
var folders = {

  ]},
  '产品文档': { files: [

    { name:'用户调研报告', type:'doc', date:'2026/10/25 11:00', size:'856 KB' },
    { name:'产品路线图 2026', type:'slide', date:'2026/10/25 09:00', size:'15.2 MB' },
    { name:'竞品分析报告', type:'doc', date:'2026/10/24 16:00', size:'3.4 MB' },
    { name:'用户画像分析', type:'sheet', date:'2026/10/23 11:30', size:'1.5 MB' },
  ]},
  '技术文档': { files: [
    { name:'系统架构文档', type:'doc', date:'2026/10/28 10:00', size:'3.4 MB' },
    { name:'部署手册 v2', type:'doc', date:'2026/10/26 15:30', size:'1.2 MB' },
    { name:'API 接口清单', type:'sheet', date:'2026/10/25 09:00', size:'340 KB' },
    { name:'数据库设计文档', type:'doc', date:'2026/10/22 17:30', size:'1.2 MB' },
    { name:'前端脚手架模板', type:'doc', date:'2026/10/20 14:00', size:'2.8 MB' },
  ]},
  '需求文档': { files: [
    { name:'心飞IM 需求规格说明书 v3.2', type:'doc', date:'2026/10/28 14:30', size:'2.1 MB' },
    { name:'前端组件技术规范', type:'doc', date:'2026/10/25 11:00', size:'856 KB' },
    { name:'API 接口文档', type:'sheet', date:'2026/10/24 16:20', size:'340 KB' },
    { name:'数据库 ER 图', type:'doc', date:'2026/10/22 17:30', size:'1.2 MB' },
    { name:'UI 设计规范 v2', type:'doc', date:'2026/10/20 10:00', size:'4.5 MB' },
  ]},
  '测试文档': { files: [
    { name:'测试计划 v1', type:'doc', date:'2026/10/26 14:00', size:'420 KB' },
    { name:'自动化测试用例', type:'sheet', date:'2026/10/25 10:00', size:'2.8 MB' },
    { name:'性能测试报告', type:'doc', date:'2026/10/23 16:00', size:'980 KB' },
  ]},
  '运营文档': { files: [

    { name:'用户增长策略', type:'doc', date:'2026/10/18 14:00', size:'780 KB' },
  ]},
  '新人手册': { files: [
    { name:'新人文档 01 - 入职指引', type:'doc', date:'2026/10/18 16:00', size:'980 KB' },
    { name:'技术栈入门指南', type:'doc', date:'2026/10/17 10:00', size:'2.3 MB' },
    { name:'常见问题 FAQ', type:'doc', date:'2026/10/15 11:00', size:'450 KB' },
  ]}
};

var currentFolder = '需求文档';
var selectedIndex = -1;
var currentCtxRow = null;

var currentView = 'list';
var ownerNames = ['张建国','李四','王五','赵六','产品部','技术部','运营部'];
var collabSets = [
  ['张建国','李四'], ['张建国','王五','赵六'], ['李四','王五'], ['王五','赵六'],
  ['张建国','李四','王五','赵六'], ['赵六','产品部'], ['张建国','技术部'],
  ['李四','王五','赵六'], ['张建国','赵六'], ['王五']
];
var avColorList = ['blue','indigo','cyan','pink','teal','orange','red','brown'];

function getFileType(type) {
  if(type === 'doc') return '文本文档';
  if(type === 'sheet') return '工作表';
  if(type === 'slide') return '演示文稿';
  if(type === 'folder') return '文件夹';
  return '文本文档';
}

function fileIconSvg(type) {
  var c = 'fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"';
  if(type === 'sheet') return '<svg viewBox="0 0 24 24" aria-hidden="true" ' + c + '><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="9" y1="9" x2="9" y2="21"/></svg>';
  if(type === 'slide') return '<svg viewBox="0 0 24 24" aria-hidden="true" ' + c + '><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>';
  if(type === 'folder') return '<svg viewBox="0 0 24 24" aria-hidden="true" ' + c + '><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h11a2 2 0 0 1 2 2z"/></svg>';
  return '<svg viewBox="0 0 24 24" aria-hidden="true" ' + c + '><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="13" y2="17"/></svg>';
}

function moreSvg() {
  return '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="var(--dt-text-icon)" stroke-width="1.6"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg>';
}

function avatarsHtml(set, max) {
  max = max || 3;
  var shown = set.slice(0, max);
  var h = shown.map(function(n, i) {
    var color = avColorList[(n.charCodeAt(0) + i) % avColorList.length];
    return '<span class="cav" style="background:var(--dt-av-' + color + ')" title="' + n + '">' + n.charAt(0) + '</span>';
  }).join('');
  if (set.length > max) h += '<span class="cav more">+' + (set.length - max) + '</span>';
  return '<div class="collab">' + h + '</div>';
}

function renderFileList() {
  var files = folders[currentFolder].files;
  var listEl = document.getElementById('fileList');
  var header = document.querySelector('.file-header');
  var html = '';

  if (currentView === 'grid') {
    header.style.display = 'none';
    listEl.className = 'file-grid';
    html = files.map(function(f, i) {
      var selected = selectedIndex === i ? ' selected' : '';
      var owner = ownerNames[i % ownerNames.length];
      return '<div class="file-card' + selected + '" onclick="selectFile(' + i + ')" ondblclick="openFile(&quot;' + f.name + '&quot;)">' +
        '<div class="fc-top"><span class="file-icon ' + f.type + '">' + fileIconSvg(f.type) + '</span>' +
        '<span class="file-more">' + moreSvg() + '</span></div>' +
        '<div class="fc-name">' + f.name + '</div>' +
        '<div class="fc-date">' + f.date + '</div>' +
        '<div class="fc-foot"><span class="fc-sub">' + owner + ' · ' + f.size + '</span>' +
        avatarsHtml(collabSets[i % collabSets.length], 2) + '</div>' +
        '</div>';
    }).join('');
  } else {
    header.style.display = '';
    listEl.className = 'file-list';
    html = files.map(function(f, i) {
      var selected = selectedIndex === i ? ' selected' : '';
      var owner = ownerNames[i % ownerNames.length];
      return '<div class="file-row' + selected + '" onclick="selectFile(' + i + ')" ondblclick="openFile(&quot;' + f.name + '&quot;)">' +
        '<div class="file-name-cell">' +
          '<div class="file-icon ' + f.type + '">' + fileIconSvg(f.type) + '</div>' +
          '<div class="file-txt"><span class="file-name">' + f.name + '</span>' +
          '<span class="file-sub">' + owner + ' · ' + getFileType(f.type) + '</span></div>' +
        '</div>' +
        '<div>' + avatarsHtml(collabSets[i % collabSets.length], 3) + '</div>' +
        '<div class="file-date">' + f.date + '</div>' +
        '<div class="file-size">' + f.size + '</div>' +
        '<div class="file-more">' + moreSvg() + '</div>' +
        '</div>';
    }).join('');
  }

  listEl.innerHTML = html;
  var st = document.getElementById('stCount');
  if (st) st.textContent = '共 ' + files.length + ' 个文件';
}

function setView(v) {
  currentView = v;
  var lb = document.getElementById('viewList');
  var gb = document.getElementById('viewGrid');
  if (lb) lb.classList.toggle('active', v === 'list');
  if (gb) gb.classList.toggle('active', v === 'grid');
  renderFileList();
}

function selectFolder(name, el) {
  currentFolder = name;
  selectedIndex = -1;
  var crumb = document.getElementById('currentCrumb');
  var sepEl = document.querySelector('.address-row .sep');
  if (name === '全部文档') {
    crumb.textContent = '';
    crumb.style.display = 'none';
    if (sepEl) sepEl.style.display = 'none';
  } else {
    crumb.textContent = name;
    crumb.style.display = '';
    if (sepEl) sepEl.style.display = '';
  }

  if(el) {
    document.querySelectorAll('.nav-item').forEach(function(e) {
      e.classList.remove('active');
    });
    el.classList.add('active');
  }

  renderFileList();
}

function selectFile(index) {
  selectedIndex = index;
  renderFileList();
}

function openFile(name) {
  showToast('打开文档：' + name);
}

function showContextMenu(e) {
  e.preventDefault();
  currentCtxRow = e.target && e.target.closest ? e.target.closest('.file-row, .file-card') : null;
  var menu = document.getElementById('contextMenu');
  menu.style.left = e.clientX + 'px';
  menu.style.top = e.clientY + 'px';
  menu.classList.add('show');
}

function ctxAction(action) {
  document.getElementById('contextMenu').classList.remove('show');
  if(action === '删除'){
    if(!currentCtxRow){ showToast('请先选择要删除的文件'); return; }
    var rows = document.querySelectorAll('#fileList .file-row, #fileList .file-card');
    var idx = Array.prototype.indexOf.call(rows, currentCtxRow);
    var nameEl = currentCtxRow.querySelector('.file-name') || currentCtxRow.querySelector('.fc-name');
    var name = nameEl ? nameEl.textContent : '该文件';
    xfConfirm({
      title:'删除文件',
      body:'确定要删除「'+name+'」吗？',
      hint:'删除后可在 30 天内从回收站恢复。',
      confirmText:'删除',
      danger:true,
      onConfirm:function(){
        var files = folders[currentFolder].files;
        if(idx > -1 && files[idx]) files.splice(idx, 1);
        if(selectedIndex === idx) selectedIndex = -1;
        renderFileList();
        showToast('已删除 ' + name);
      }
    });
    return;
  }
  showToast(action);
}

// 点击其他地方关闭右键菜单
document.addEventListener('click', function() {
  document.getElementById('contextMenu').classList.remove('show');
});

function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); }, 1500);
}

// 初始化
renderFileList();
</script>
