<style>
/* Windows资源管理器风格 - 完整版 */
body { display:flex; height:100vh; overflow:hidden; background:var(--dt-bg-body); font-size:13px; }

/* L1 主导航（保持不变） */

/* 左侧导航栏 */
.nav-sidebar { width:var(--dt-l2-width); background:var(--dt-bg-card); border-right:1px solid var(--dt-border); display:flex; flex-direction:column; flex-shrink:0; }
.nav-section-title { padding:8px 16px 4px; font-size:11px; font-weight:600; color:var(--dt-text-tertiary); }
.nav-item { display:flex; align-items:center; gap:12px; height:40px; padding:0 16px; cursor:pointer; color:var(--dt-text-primary); font-size:14px; border-radius:var(--dt-radius-md); transition:background 0.1s; }
.nav-item:hover { background:var(--dt-bg-hover); }
.nav-item.active { background:var(--dt-bg-session-active); }
.nav-item .nav-icon { display:flex; align-items:center; justify-content:center; width:16px; height:16px; font-size:16px; }
.nav-item .nav-icon svg { width:16px; height:16px; }
.nav-item .nav-label { flex:1; }
.nav-item .nav-badge { font-size:11px; color:var(--dt-text-secondary); }

/* 主内容区 */
.main-area { flex:1; display:flex; flex-direction:column; background:var(--dt-bg-card); margin:8px; border:1px solid var(--dt-border); border-radius:var(--dt-radius-sm); overflow:hidden; }

/* 菜单栏 */
.menu-bar { display:flex; align-items:center; padding:0 8px; background:var(--dt-bg-body); border-bottom:1px solid var(--dt-border); }
.menu-item { padding:6px 12px; cursor:pointer; color:var(--dt-text-primary); font-size:13px; }
.menu-item:hover { background:var(--dt-brand-light); }

/* 工具栏 */
.toolbar { display:flex; align-items:center; gap:4px; padding:6px 8px; border-bottom:1px solid var(--dt-border); background:var(--dt-bg-body); }
.toolbar-btn { display:flex; align-items:center; gap:4px; padding:6px 12px; border:none; background:transparent; border-radius:var(--dt-radius-sm); cursor:pointer; color:var(--dt-text-primary); font-size:12px; }
.toolbar-btn:hover { background:var(--dt-brand-light); }
.toolbar-btn .icon { font-size:14px; }
.toolbar-sep { width:1px; height:20px; background:var(--dt-border); margin:0 4px; }

/* 地址栏行 */
.address-row { display:flex; align-items:center; gap:6px; padding:6px 8px; border-bottom:1px solid var(--dt-border); background:var(--dt-bg-card); }
.nav-btns { display:flex; gap:2px; }
.nav-btn { width:28px; height:28px; border:none; background:transparent; border-radius:var(--dt-radius-sm); cursor:pointer; display:flex; align-items:center; justify-content:center; color:var(--dt-text-secondary); }
.nav-btn:hover { background:var(--dt-brand-light); }
.nav-btn:disabled { opacity:0.4; cursor:default; }

.address-bar { flex:1; display:flex; align-items:center; gap:4px; padding:5px 12px; background:var(--dt-bg-card); border:1px solid var(--dt-border); border-radius:var(--dt-radius-sm); font-size:13px; }
.address-bar .crumb { color:var(--dt-brand); cursor:pointer; padding:2px 6px; border-radius:3px; }
.address-bar .crumb:hover { background:var(--dt-brand-light); }
.address-bar .sep { color:var(--dt-text-tertiary); }
.address-bar .current { font-weight:500; color:var(--dt-text-primary); }

.search-box { display:flex; align-items:center; gap:4px; padding:5px 12px; background:var(--dt-bg-card); border:1px solid var(--dt-border); border-radius:var(--dt-radius-sm); font-size:12px; color:var(--dt-text-secondary); width:180px; }

/* 文件列表 */
.file-header { display:grid; grid-template-columns:1fr 110px 90px 70px; gap:8px; padding:6px 12px; font-size:12px; color:var(--dt-text-secondary); background:var(--dt-bg-body); border-bottom:1px solid var(--dt-border); font-weight:500; }
.file-header .sortable { cursor:pointer; display:flex; align-items:center; gap:4px; }
.file-header .sortable:hover { color:var(--dt-brand); }

.file-list { flex:1; overflow-y:auto; background:var(--dt-bg-card); }
.file-row { display:grid; grid-template-columns:1fr 110px 90px 70px; gap:8px; padding:5px 12px; font-size:13px; color:var(--dt-text-primary); cursor:pointer; align-items:center; }
.file-row:hover { background:var(--dt-brand-light); }
.file-row.selected { background:var(--dt-brand-light); }
.file-row.selected .file-name { color:var(--dt-text-primary); }

.file-name-cell { display:flex; align-items:center; gap:8px; }
.file-icon { width:24px; height:24px; border-radius:3px; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; color:var(--dt-bg-card); flex-shrink:0; }
.file-icon.folder { background:#ffc107; color:var(--dt-bg-card); font-size:12px; }
.file-icon.doc { background:#2b579a; }
.file-icon.sheet { background:#217346; }
.file-icon.slide { background:#c43e1c; }
.file-name { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.file-date { color:var(--dt-text-secondary); font-size:12px; }
.file-type { color:var(--dt-text-secondary); font-size:12px; }
.file-size { color:var(--dt-text-secondary); font-size:12px; text-align:right; }

/* 状态栏 */
.status-bar { display:flex; align-items:center; justify-content:space-between; padding:5px 12px; border-top:1px solid var(--dt-border); background:var(--dt-bg-body); font-size:12px; color:var(--dt-text-secondary); }

/* 右键菜单 */
.context-menu { display:none; position:fixed; background:var(--dt-bg-card); border:1px solid var(--dt-border); border-radius:var(--dt-radius-sm);  z-index:1000; min-width:160px; padding:4px 0; }
.context-menu.show { display:block; }
.ctx-item { padding:6px 16px; cursor:pointer; font-size:13px; color:var(--dt-text-primary); display:flex; align-items:center; gap:8px; }
.ctx-item:hover { background:var(--dt-brand-light); }
.ctx-item .ctx-icon { width:16px; text-align:center; }
.ctx-sep { height:1px; background:var(--dt-border); margin:4px 0; }

/* Toast */
.toast { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:rgba(0,0,0,0.8); color:var(--dt-bg-card); padding:12px 24px; border-radius:var(--dt-radius-sm); font-size:13px; z-index:999; opacity:0; transition:opacity 0.2s; pointer-events:none; }
.toast.show { opacity:1; }
</style>
</head>

var currentFolder = '需求文档';
var selectedIndex = -1;
var currentCtxRow = null;

function getFileIcon(type) {
  if(type === 'doc') return '<div class="file-icon doc">DOC</div>';
  if(type === 'sheet') return '<div class="file-icon sheet">XLS</div>';
  if(type === 'slide') return '<div class="file-icon slide">PPT</div>';
  return '<div class="file-icon doc">DOC</div>';
}

function getFileType(type) {
  if(type === 'doc') return '文本文档';
  if(type === 'sheet') return '工作表';
  if(type === 'slide') return '演示文稿';
  return '文本文档';
}

function renderFileList() {
  var files = folders[currentFolder].files;
  var html = '';
  files.forEach(function(f, i) {
    var selected = selectedIndex === i ? ' selected' : '';
    html += '<div class="file-row'+selected+'" onclick="selectFile('+i+')" ondblclick="openFile(\''+f.name+'\')">' +
      '<div class="file-name-cell">' +
        getFileIcon(f.type) +
        '<span class="file-name">'+f.name+'</span>' +
      '</div>' +
      '<div class="file-date">'+f.date+'</div>' +
      '<div class="file-type">'+getFileType(f.type)+'</div>' +
      '<div class="file-size">'+f.size+'</div>' +
    '</div>';
  });
  document.getElementById('fileList').innerHTML = html;
}

function selectFolder(name, el) {
  currentFolder = name;
  selectedIndex = -1;
  document.getElementById('currentCrumb').textContent = name;

  if(el) {
    document.querySelectorAll('.nav-item').forEach(function(e) {
      e.classList.remove('active');
    });
    el.classList.add('active');
  }

  renderFileList();
}

function selectFile(index) {
  selectedIndex = index;
  renderFileList();
}

function openFile(name) {
  showToast('打开文档：' + name);
}

function showContextMenu(e) {
  e.preventDefault();
  currentCtxRow = e.target && e.target.closest ? e.target.closest('.file-row') : null;
  var menu = document.getElementById('contextMenu');
  menu.style.left = e.clientX + 'px';
  menu.style.top = e.clientY + 'px';
  menu.classList.add('show');
}

function ctxAction(action) {
  document.getElementById('contextMenu').classList.remove('show');
  if(action === '删除'){
    if(!currentCtxRow){ showToast('请先选择要删除的文件'); return; }
    var rows = document.querySelectorAll('.file-row');
    var idx = Array.prototype.indexOf.call(rows, currentCtxRow);
    var nameEl = currentCtxRow.querySelector('.file-name');
    var name = nameEl ? nameEl.textContent : '该文件';
    xfConfirm({
      title:'删除文件',
      body:'确定要删除「'+name+'」吗？',
      hint:'删除后可在 30 天内从回收站恢复。',
      confirmText:'删除',
      danger:true,
      onConfirm:function(){
        var files = folders[currentFolder].files;
        if(idx > -1 && files[idx]) files.splice(idx, 1);
        if(selectedIndex === idx) selectedIndex = -1;
        renderFileList();
        showToast('已删除 ' + name);
      }
    });
    return;
  }
  showToast(action);
}

// 点击其他地方关闭右键菜单
document.addEventListener('click', function() {
  document.getElementById('contextMenu').classList.remove('show');
});

function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); }, 1500);
}

// 初始化
renderFileList();
